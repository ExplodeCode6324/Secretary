<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secretary · Go Demo</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233448;background:#eef1f4;font-size:14px}*{box-sizing:border-box}body{margin:0}header{height:76px;background:#172c40;color:#fff;padding:18px 30px;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0;font-weight:650;letter-spacing:.5px}.sub{font-size:12px;opacity:.65;margin-top:6px}main{display:grid;grid-template-columns:minmax(380px,1.4fr) minmax(380px,1fr);gap:20px;padding:24px;max-width:1600px;margin:auto}.panel{background:white;border:1px solid #dbe1e7;border-radius:12px;overflow:hidden}.title{padding:17px 20px;border-bottom:1px solid #e8edf1;display:flex;justify-content:space-between;align-items:center;font-weight:650}.pill{font-size:11px;border-radius:5px;padding:4px 7px;background:#e7eef5;color:#385474;font-weight:550}.chat{height:calc(100vh - 290px);min-height:340px;overflow:auto;padding:20px}.message{margin-bottom:18px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.message .who{color:#8b98a5;font-size:11px;margin-bottom:5px;font-weight:600}.message.master{background:#f0f5fa;padding:12px 15px;border-radius:8px}.message.secretary{padding:4px 12px;border-left:3px solid #6294a4}.message.notice{padding:12px;background:#fff7df;border-radius:8px}.compose{padding:15px;border-top:1px solid #e4eaf0;display:flex;gap:10px;align-items:flex-end}textarea,input{font:inherit;border:1px solid #cdd6df;border-radius:7px;padding:10px;background:#fcfdff;color:inherit}textarea{width:100%;resize:vertical;min-height:66px}button{flex-shrink:0;white-space:nowrap;cursor:pointer;font:inherit;border:1px solid #c7d2dd;border-radius:7px;background:#fff;color:#29475e;padding:8px 12px}button.primary{background:#256876;border-color:#256876;color:white}button.danger{color:#ad4040}button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}.side{display:flex;flex-direction:column;gap:18px}.items{padding:14px;max-height:330px;overflow:auto}.empty{padding:18px 8px;color:#8895a3;line-height:1.7}.card{border:1px solid #e0e6ec;border-radius:8px;padding:13px;margin-bottom:12px}.card:last-child{margin-bottom:0}.card h3{font-size:13px;margin:0 0 9px}.card .meta{font-size:11px;color:#8191a1;margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:10px;border-radius:6px;font:12px/1.6 ui-monospace,monospace;max-height:240px;overflow:auto}.status{font-size:12px;max-width:55%;text-align:right;line-height:1.6}.error{color:#b54838}.toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}#login{position:fixed;inset:0;background:#172c40e8;display:flex;align-items:center;justify-content:center;z-index:4}.loginbox{background:white;border-radius:12px;padding:28px;width:420px}.loginbox input{width:100%;margin:12px 0}.loginbox p{line-height:1.6;color:#738395}dialog{border:1px solid #ccd8e1;border-radius:12px;width:min(900px,90vw);max-height:85vh;padding:22px}dialog::backdrop{background:#10253588}details summary{cursor:pointer;color:#607789;font-size:12px}@media(max-width:850px){main{display:block;padding:12px}.side{margin-top:16px}.chat{height:420px}header{padding:16px}.status{max-width:50%}}
</style>
<header><div><h1>Secretary <span style="opacity:.45;font-weight:400">/ Go Demo</span></h1><div class="sub">唯一主会话 · 可恢复任务 · 明确授权</div></div><div class="status" id="status">正在连接本地服务…</div></header>
<main><section class="panel"><div class="title">与 Secretary 对话 <span class="pill" id="hostState">LOCAL</span></div><div class="chat" id="chat"><div class="empty" id="intro">Master，任务、记忆和对话会保存在本地。<br>操作授权会出现在右侧，聊天中的「同意」不会批准操作。</div></div><form class="compose" id="compose"><textarea id="input" placeholder="描述目标，或继续之前的事项…" required></textarea><button class="primary" id="send">发送</button></form></section>
<div class="side"><section class="panel"><div class="title">待授权操作 <span class="pill" id="approvalCount">0</span></div><div class="items" id="approvals"></div></section><section class="panel"><div class="title">任务与普通决定 <span class="pill" id="taskCount">0</span></div><div class="items" id="tasks"></div></section><section class="panel"><div class="title">记忆与恢复</div><div class="toolbar"><button id="memoryBtn">工作记忆</button><button id="worldBtn">长期事实</button><button id="compactBtn">整理工作记忆</button><button id="retryBtn">继续保存的进度</button><button id="rulesBtn">持续授权规则</button></div><div style="padding:0 15px 12px;color:#8694a2;font-size:11px">进程停止不删除已保存资料；结果不明的外部操作不会自动重做。</div></section></div></main>
<div id="login"><form class="loginbox" id="loginForm"><h2>连接本地 Secretary</h2><p>启动脚本会自动登录。手动启动时，请输入本地 data/master.token 中的凭据。</p><input type="password" id="token" placeholder="本地 Master 凭据" required><button class="primary">连接</button><p id="loginError"></p></form></div><dialog id="detail"><div class="title"><span id="detailTitle"></span><button id="closeDetail">关闭</button></div><pre id="detailBody"></pre></dialog>
<dialog id="rulesDialog"><div class="title">持续授权规则<button id="closeRules">关闭</button></div><p>规则会持续放行匹配的动作、资源路径与参数；与「批准这一次」独立。只填写您明确允许的范围。</p><pre id="existingRules"></pre><textarea id="ruleDraft" style="height:210px" placeholder='{"actions":["file.write"],"resource_prefixes":["完整且明确的任务工作目录"],"parameter_constraints":{"type":"object","properties":{"path":{"const":"指定文件.txt"}},"required":["path"]},"expires_at":"UTC RFC3339 到期时间"}'></textarea><div class="actions"><button id="saveRule" class="primary">确认保存这条持续规则</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let after=0,busy=false,session,approvalSignature="",taskSignature="";const uuid=()=>crypto.randomUUID();
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(r.status===401){$('login').style.display='flex';throw Error('需要登录')}const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function show(title,value){$('detailTitle').textContent=title;$('detailBody').textContent=typeof value==='string'?value:JSON.stringify(value,null,2);$('detail').showModal()}
function msg(who,text,cls){$('intro')?.remove();const n=el('div',undefined,'message '+cls);n.append(el('div',who,'who'),el('div',text));$('chat').append(n);$('chat').scrollTop=$('chat').scrollHeight}
async function login(token){await api('/v1/login',{token});$('login').style.display='none';await poll()}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await login($('token').value);$('token').value=''}catch(e){$('loginError').textContent=e.message}};
$('compose').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;const text=$('input').value;try{await api('/v1/inputs',{request_id:uuid(),text});$('input').value='';await poll()}catch(e){show('输入未确认',e.message)}finally{$('send').disabled=false}};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('compose').requestSubmit()}};
async function poll(){if(busy)return;busy=true;try{session=await api('/v1/session');$('login').style.display='none';$('hostState').textContent=session.session.state;const run=session.runtime;$('status').textContent=(run.world_available?'World Model 已连接':'World Model 未连接')+' · '+run.workers+' 个执行者'+(run.error?'\n'+run.error:'');$('status').className='status'+(run.error?' error':'');const events=await api('/v1/events?after='+after);for(const {event,payload:p} of events.events){if(event.event_type==='input.accepted')msg('MASTER',p.text,'master');if(event.stream==='MAIN'&&event.event_type==='model.response'){const text=(p.response.output||[]).filter(x=>x.type==='message').flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('');if(text)msg('SECRETARY',text,'secretary')}if(event.event_type==='notification.queued'){msg('主动提醒',p.text,'notice');await api('/v1/notifications/ack',{id:p.notification_id})}}after=events.next;await renderApprovals();await renderTasks()}catch(e){$('status').textContent=e.message}finally{busy=false}}
async function renderApprovals(){const list=(await api('/v1/approvals')).filter(x=>['PENDING','APPROVED'].includes(x.request.state));const signature=JSON.stringify(list);if(signature===approvalSignature)return;approvalSignature=signature;$('approvalCount').textContent=list.length;$('approvals').replaceChildren();if(!list.length){$('approvals').append(el('div','暂无待批准操作','empty'));return}for(const {request:q,display:v} of list){const c=el('div',undefined,'card');c.append(el('h3',v.action.action==='file.write'?'写入任务文件':v.action.action==='program.run'?'启动已登记程序':'更新长期事实'),el('div',v.action.resource,'meta'),el('div','执行：'+(v.scope.execution_id||'主会话认知变更'),'meta'));const preview=v.action.action==='file.write'?{文件:v.parameters.path,内容:v.parameters.content}:v.action.action==='program.run'?{参数:v.parameters.parameters}:v.parameters;c.append(el('pre',JSON.stringify(preview,null,2)));const complete=el('details');complete.append(el('summary','完整授权范围与校验信息'),el('pre',JSON.stringify(v,null,2)));const actions=el('div',undefined,'actions');for(const [label,decision,cls] of q.state==='PENDING'?[['批准这一次','APPROVE','primary'],['拒绝','REJECT','danger']]:[['撤销批准','REVOKE','danger']]){const b=el('button',label,cls);b.onclick=async()=>{b.disabled=true;try{await api('/v1/approvals/decisions',{schema_version:1,record_type:'ApprovalCommand',request_id:uuid(),authorization_id:q.id,expected_revision:q.revision,display_hash:q.display_hash,decision});await poll()}catch(e){show('授权未生效',e.message)}};actions.append(b)}c.append(actions,complete);$('approvals').append(c)}}
async function renderTasks(){const data=await api('/v1/tasks');const operations=await api('/v1/operations');const signature=JSON.stringify([data,operations]);if(signature===taskSignature)return;taskSignature=signature;$('tasks').replaceChildren();$('taskCount').textContent=data.plans.length+' 计划 / '+data.executions.length+' 执行';for(const p of data.plans.filter(p=>p.state!=='CLOSED')){const c=el('div',undefined,'card');c.append(el('h3',data.goals?.[p.id]||p.id.slice(0,8)),el('div',p.state+' · '+p.trigger.kind+(p.next_due_at?' · 下次 '+new Date(p.next_due_at).toLocaleString():''),'meta'));const actions=el('div',undefined,'actions');for(const [label,action] of p.state==='ACTIVE'?[['暂停计划','PAUSE_PLAN'],['结束计划','CLOSE_PLAN']]:p.state==='PAUSED'?[['恢复计划','RESUME_PLAN'],['结束计划','CLOSE_PLAN']]:[['结束计划','CLOSE_PLAN']]){const b=el('button',label);b.onclick=async()=>{try{await api('/v1/task-control',{request_id:uuid(),args:{action,target_id:p.id,expected_revision:p.revision}});await poll()}catch(e){show('计划控制',e.message)}};actions.append(b)}c.append(actions);$('tasks').append(c)}if(!data.executions.length)$('tasks').append(el('div','暂无任务执行','empty'));for(const x of data.executions.slice().reverse()){const c=el('div',undefined,'card');c.append(el('h3',x.state+' · '+(data.goals?.[x.task_id]||x.id.slice(0,8))),el('div','计划 '+x.task_id.slice(0,8)+' · '+x.retention_state,'meta'));const actions=el('div',undefined,'actions');const detail=el('button','查看详情');detail.onclick=async()=>{try{show('执行详情',await api('/v1/task-detail?execution_id='+x.id))}catch(e){show('执行详情',e.message)}};actions.append(detail);if(!['SUCCEEDED','FAILED','CANCELLED','EXPIRED','RESULT_UNKNOWN'].includes(x.state)){const cancel=el('button','请求取消','danger');cancel.onclick=async()=>{try{await api('/v1/task-control',{request_id:uuid(),args:{action:'CANCEL_EXECUTION',target_id:x.id,expected_revision:x.revision}});await poll()}catch(e){show('取消请求',e.message)}};actions.append(cancel)}for(const q of data.decisions.filter(q=>q.execution_id===x.id&&q.state==='OPEN')){c.append(el('div',q.question));const answer=el('input');answer.placeholder='普通工作决定（不授予权限）';c.append(answer);const send=el('button','提交决定');send.onclick=async()=>{try{await api('/v1/task-control',{request_id:uuid(),args:{action:'ANSWER_DECISION',target_id:x.id,expected_revision:x.revision,decision_request_id:q.id,answer:answer.value}});await poll()}catch(e){show('提交决定',e.message)}};actions.append(send)}c.append(actions);$('tasks').append(c)}for(const o of operations.filter(o=>o.state==='RESULT_UNKNOWN')){const c=el('div',undefined,'card');c.append(el('h3','结果待核验 · '+o.action.action),el('div',o.action.resource,'meta'));if(o.action.action==='file.write'){const b=el('button','只读核验现有文件');b.onclick=async()=>{try{show('核验结果',await api('/v1/reconcile',{operation_id:o.id}));await poll()}catch(e){show('仍需核验',e.message)}};c.append(b)}$('tasks').append(c)}}
$('rulesBtn').onclick=async()=>{$('existingRules').textContent=JSON.stringify(await api('/v1/rules'),null,2);$('rulesDialog').showModal()};$('closeRules').onclick=()=>$('rulesDialog').close();$('saveRule').onclick=async()=>{try{await api('/v1/rules',{request_id:uuid(),args:JSON.parse($('ruleDraft').value)});$('rulesDialog').close();await poll()}catch(e){show('规则未保存',e.message)}};
$('closeDetail').onclick=()=>$('detail').close();$('memoryBtn').onclick=()=>show('Consciousness · 工作记忆',session?.consciousness);$('worldBtn').onclick=async()=>{try{show('World Model · 带来源的长期事实',await api('/v1/world'))}catch(e){show('World Model',e.message)}};$('compactBtn').onclick=async()=>{await api('/v1/maintenance',{});await poll()};$('retryBtn').onclick=async()=>{await api('/v1/retry',{});await poll()};const token=new URLSearchParams(location.hash.slice(1)).get('token');if(token){history.replaceState(null,'',location.pathname);login(token).catch(e=>$('loginError').textContent=e.message)}else poll();setInterval(poll,1500);
</script></html>
