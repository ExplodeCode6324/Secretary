name: Desktop study (macOS)
on:
  pull_request:
    paths: ['src/secretary_desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/secretary_desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/secretary_desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run tauri -- build -- --locked
      - name: Report coverage
        run: echo 'Mac build and logic checks only. Native IME and Master visual approval require the evidence report. Linux NOT_TESTED (deferred).'
