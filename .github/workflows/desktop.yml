name: Desktop study (macOS)
on:
  pull_request:
    paths: ['src/secretary_desktop/**', 'docs/api/v1/**', 'src/pi_secretary/src/**', 'test_case/offline/issue59/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/secretary_desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/secretary_desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm ci
        working-directory: .
      - run: npm run contracts:check && npm run check && npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - run: npm run tauri -- build -- --locked
      - name: Report coverage
        run: echo 'Mac build, native library real Core integration, and logic checks. WKWebView E2E is recorded locally. Native IME and Master visual approval require the evidence report. Linux NOT_TESTED (deferred).'
