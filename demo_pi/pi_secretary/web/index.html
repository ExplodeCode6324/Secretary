<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Secretary · Pi Demo</title>
  <style>
    body {
      font: 16px system-ui;
      background: #f4f5f7;
      color: #202936;
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }
    h1 {
      margin: 0;
    }
    header {
      margin-bottom: 22px;
    }
    section {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      border: 1px solid #dce0e6;
    }
    textarea,
    input {
      padding: 10px;
      font: inherit;
      border: 1px solid #cbd2da;
      border-radius: 6px;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      min-height: 90px;
    }
    button {
      padding: 9px 16px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      background: #264b78;
      color: white;
      cursor: pointer;
    }
    .reject {
      background: #805049;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 340px;
      overflow: auto;
    }
    small {
      color: #536475;
    }
    .row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .badge {
      background: #e9edf3;
      padding: 5px 8px;
      border-radius: 4px;
    }
    #error {
      color: #a22020;
    }
  </style>
  <header>
    <h1>Secretary</h1>
    <p>会话 · 任务 · Master 授权 <span id="mode" class="badge"></span></p>
  </header>
  <section id="login">
    <label
      >Master 访问密钥
      <input id="token" type="password" autocomplete="off" /></label
    ><button id="connect">连接</button
    ><small>密钥保存在启动时显示的 master.token 文件中，仅在本机使用。</small>
  </section>
  <div id="error"></div>
  <section>
    <h2>主会话</h2>
    <div id="messages"></div>
    <textarea
      id="input"
      placeholder="输入消息；离线验证可输入 task: 整理一份测试报告"
    ></textarea
    ><button id="send">发送</button
    ><button id="resume">重试已中断的模型调用</button
    ><button id="compact">整理工作记忆</button>
    <div id="host"></div>
  </section>
  <section>
    <h2>等待授权</h2>
    <small>这里的批准直接交给 Scheduler，聊天中的“同意”不会授权。</small>
    <div id="approvals"></div>
  </section>
  <section>
    <h2>任务</h2>
    <input id="goal" placeholder="目标" /><select id="program">
      <option value="">Agent 任务</option></select
    ><button id="newtask">创建任务</button>
    <div id="tasks"></div>
  </section>
  <section>
    <h2>普通工作决定</h2>
    <div id="decisions"></div>
  </section>
  <section>
    <h2>详细资料</h2>
    <pre id="detail">点击任务“详情”查看。</pre>
  </section>
  <script>
    let token = sessionStorage.getItem("secretary-token") || "";
    document.querySelector("#token").value = token;
    const text = (tag, value) => {
      const el = document.createElement(tag);
      el.textContent = value;
      return el;
    };
    async function api(url, body) {
      const r = await fetch("/api/" + url, {
        method: body ? "POST" : "GET",
        headers: {
          Authorization: "Bearer " + token,
          ...(body ? { "Content-Type": "application/json" } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const value = await r.json();
      if (!r.ok) throw Error(value.error || r.statusText);
      return value;
    }
    function button(title, action) {
      const b = text("button", title);
      b.onclick = () => action().catch(showError);
      return b;
    }
    function showError(e) {
      document.querySelector("#error").textContent = String(e);
    }
    async function refresh() {
      if (!token) return;
      try {
        const s = await api("state");
        document.querySelector("#error").textContent = "";
        document.querySelector("#mode").textContent =
          `${s.mode} · 主会话 ${s.models.main} · 执行 ${s.models.task}`;
        document.querySelector("#host").textContent =
          s.session.state +
          (s.session.recovery_error ? " · " + s.session.recovery_error : "");
        const msgs = document.querySelector("#messages");
        msgs.replaceChildren();
        for (const m of s.messages
          .filter((m) => m.role === "user" || m.role === "assistant")
          .slice(-12)) {
          const content =
            typeof m.content === "string"
              ? m.content
              : m.content
                  .filter((c) => c.type === "text")
                  .map((c) => c.text)
                  .join("\n");
          if (content) msgs.append(text("pre", m.role + ": " + content));
        }
        const approvals = document.querySelector("#approvals");
        approvals.replaceChildren();
        for (const a of s.approvals.filter(
          (a) => a.state === "PENDING" || a.state === "APPROVED",
        )) {
          const row = text("div", "");
          row.className = "row";
          row.append(text("p", a.action.action + " → " + a.action.resource));
          row.append(
            text(
              "pre",
              JSON.stringify(await api("approval?id=" + a.id), null, 2),
            ),
          );
          row.append(
            button(
              "查看完整请求",
              async () =>
                (document.querySelector("#detail").textContent = JSON.stringify(
                  await api("approval?id=" + a.id),
                  null,
                  2,
                )),
            ),
          );
          for (const decision of a.state === "PENDING"
            ? ["APPROVE", "REJECT"]
            : ["REVOKE"])
            row.append(
              button(
                { APPROVE: "批准此次操作", REJECT: "拒绝", REVOKE: "撤销" }[
                  decision
                ],
                async () => {
                  await api("approve", {
                    request_id: crypto.randomUUID(),
                    authorization_id: a.id,
                    expected_revision: a.revision,
                    display_hash: a.display_hash,
                    decision,
                  });
                  await refresh();
                },
              ),
            );
          approvals.append(row);
        }
        const tasks = document.querySelector("#tasks");
        tasks.replaceChildren();
        for (const e of s.executions) {
          const p = s.tasks.find((t) => t.id === e.task_id);
          const row = text(
            "div",
            (p?.goal || e.id.slice(0, 8)) +
              " · " +
              e.state +
              " · " +
              e.retention_state,
          );
          row.className = "row";
          row.append(
            button(
              "详情",
              async () =>
                (document.querySelector("#detail").textContent = JSON.stringify(
                  await api("detail?execution_id=" + e.id),
                  null,
                  2,
                )),
            ),
          );
          row.append(
            button("取消", async () => {
              await api("cancel", { id: e.id });
              await refresh();
            }),
          );
          tasks.append(row);
        }
        const select = document.querySelector("#program");
        const selected = select.value;
        select.replaceChildren(new Option("Agent 任务", ""));
        for (const p of s.programs) select.add(new Option(p.name, p.id));
        select.value = selected;
        const ds = document.querySelector("#decisions");
        ds.replaceChildren();
        for (const d of s.decisions.filter((d) => d.state === "OPEN")) {
          const row = text("div", d.question);
          row.append(
            button("回答", async () => {
              const answer = prompt(d.question);
              if (answer !== null) await api("decision", { id: d.id, answer });
              await refresh();
            }),
          );
          ds.append(row);
        }
      } catch (e) {
        showError(e);
      }
    }
    document.querySelector("#connect").onclick = () => {
      token = document.querySelector("#token").value;
      sessionStorage.setItem("secretary-token", token);
      refresh();
    };
    document.querySelector("#send").onclick = async () => {
      try {
        await api("input", {
          text: document.querySelector("#input").value,
          request_id: crypto.randomUUID(),
        });
        document.querySelector("#input").value = "";
        await refresh();
      } catch (e) {
        showError(e);
      }
    };
    document.querySelector("#newtask").onclick = async () => {
      try {
        await api("task", {
          goal: document.querySelector("#goal").value,
          program_id: document.querySelector("#program").value || undefined,
          request_id: crypto.randomUUID(),
        });
        await refresh();
      } catch (e) {
        showError(e);
      }
    };
    document.querySelector("#resume").onclick = () =>
      api("resume", {}).catch(showError);
    document.querySelector("#compact").onclick = () =>
      api("compact", {}).catch(showError);
    setInterval(refresh, 1500);
    refresh();
  </script>
</html>
