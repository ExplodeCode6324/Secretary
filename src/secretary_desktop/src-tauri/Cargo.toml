[package]
name = "secretary-desktop-spike"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
[features]
default = []
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
